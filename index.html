<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boodschappenlijst</title>
<meta name="description" content="Gedeelde boodschappen- en vakantielijsten voor thuis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F1F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappenlijst">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
/* Eén smalle kolom zoals een boodschappenbriefje; vaste kop met lijst-tabs, invoer bovenaan.
   Supermarkt: groepen in AH-looproute. Vakantielijst: nalopen → kopen → inpakken → ingepakt. */
:root{
  --paper:#F1F5F1; --card:#FFFFFF; --ink:#16221B; --muted:#5D6B63; --line:#D6DFD8;
  --accent:#1E6A49; --accent-soft:#DCEBE2; --accent-ink:#FFFFFF; --danger:#B3402F; --danger-soft:#F6E2DE;
  --warn:#9A6A00; --warn-soft:#F7EDD2; --sky:#2D5F8A; --sky-soft:#DFE9F2;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1512; --card:#17201B; --ink:#E6EEE9; --muted:#93A299; --line:#26332C;
  --accent:#5EC191; --accent-soft:#1D3328; --accent-ink:#0B1A12; --danger:#E7826F; --danger-soft:#3A221D;
  --warn:#E0B24F; --warn-soft:#352B14; --sky:#8DB8E0; --sky-soft:#1A2836; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1512; --card:#17201B; --ink:#E6EEE9; --muted:#93A299; --line:#26332C;
  --accent:#5EC191; --accent-soft:#1D3328; --accent-ink:#0B1A12; --danger:#E7826F; --danger-soft:#3A221D;
  --warn:#E0B24F; --warn-soft:#352B14; --sky:#8DB8E0; --sky-soft:#1A2836; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default;opacity:.5}

header{position:sticky;z-index:5;background:var(--paper);top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:0;line-height:1.1}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--accent)}
.status.offline .dot{background:var(--warn)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.95rem;display:flex;align-items:center;gap:7px}
.chip svg{width:15px;height:15px;opacity:.8}
.chip .n{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);font-weight:600}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-current="true"] .n{color:var(--accent-ink);opacity:.8}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}

main{display:grid;gap:18px;padding-top:16px}
.stack{display:grid;gap:18px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.listhead h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;min-width:0;overflow-wrap:anywhere}
.listhead .sub{display:block;font-family:var(--font);font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem;color:var(--muted);flex:none}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.panel label.lbl,.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1 1 180px;min-width:0}
.divider{border-top:1px solid var(--line);margin:2px 0}
input[type=text],input[type=password],select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--accent-soft);color:var(--ink)}
.btn.del{background:var(--danger-soft);color:var(--danger)}
.btn.delsolid{background:var(--danger);color:var(--card)}
.confirm{font-size:.9rem}
.switch{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;cursor:pointer}
.switch input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.switch small{display:block;color:var(--muted);font-size:.8rem}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;background:var(--paper)}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind b{font-size:.95rem}
.kind span{font-size:.78rem;color:var(--muted)}
.kind:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--card)}
.kind:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

#add{display:flex;gap:8px}
#add input{flex:1;min-width:0;background:var(--card);font-size:1.05rem;padding:13px 14px}
.hint{font-size:.8rem;color:var(--muted);margin:-10px 2px 0}

ul{list-style:none;margin:0;padding:0}
.items{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"]{background:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1;color:var(--accent-ink)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1.02rem;text-align:left;background:none;border:0;padding:0}
button.txt{cursor:pointer}
.done .txt,.packed .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.who{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-size:.72rem;font-weight:700;display:grid;place-items:center}
.x{flex:none;background:none;border:0;color:var(--muted);width:38px;height:38px;border-radius:8px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
@media (hover:hover){.x:hover{background:var(--paper);color:var(--danger)}}

.groups{display:grid;gap:14px}
.group{display:grid;gap:6px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px}
.ghead h3{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.ghead .gn{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.group.new .ghead h3{color:var(--warn)}
.group.new .items{border-color:var(--warn);border-style:dashed}
.ghead .mini{background:none;border:0;color:var(--accent);font-size:.82rem;font-weight:600;padding:2px 0}

.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle{background:none;border:0;padding:4px 0;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.toggle svg{width:12px;height:12px;transition:transform .15s}
.toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.link{background:none;border:0;color:var(--danger);font-size:.85rem;font-weight:600;padding:4px 0}

/* vakantielijst */
.progress{display:grid;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-packed{background:var(--accent)}
.bar .b-home{background:var(--sky)}
.bar .b-buy{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pills{display:flex;gap:6px;flex:none}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.home{color:var(--sky);border-color:var(--sky-soft);background:var(--sky-soft)}
.pill.buy{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}
.tag{font-size:.75rem;color:var(--muted);white-space:nowrap;flex:none}
.tag.ok{color:var(--accent);font-weight:600}
.sendbar{display:grid;gap:8px;background:var(--warn-soft);border-radius:var(--r);padding:12px}
.sendbar p{margin:0;font-size:.9rem}
.sendbar .row select{flex:1 1 150px;width:auto;background:var(--card)}
.tripsec .ghead h3.buy{color:var(--warn)}
.tripsec .ghead h3.home{color:var(--sky)}
.tripsec .ghead h3.packed{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:4px}
.empty .btn{margin-top:12px}

footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8rem;color:var(--muted);padding-top:8px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:.8rem}

/* categorie kiezen */
#sheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end}
#sheet .bg{position:absolute;inset:0;background:rgba(10,20,15,.45)}
#sheet .panel{position:relative;border-radius:16px 16px 0 0;max-height:80vh;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet h4{margin:0;font-size:1.05rem;font-family:var(--display)}
#sheet p{margin:-6px 0 0;font-size:.85rem;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catgrid button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:left;font-size:.9rem;font-weight:500}
.catgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

/* inlogscherm */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#login form{width:100%;max-width:380px;display:grid;gap:14px}
#login h1{font-size:2rem}
#login p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:40;text-align:center}
@media (max-width:380px){.pill{padding:5px 8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* slepen */
.grip{flex:none;width:26px;height:38px;margin-left:-6px;display:grid;place-items:center;background:none;border:0;padding:0;color:var(--muted);opacity:.7;touch-action:none;cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grip svg{width:14px;height:14px}
.grip:focus-visible{opacity:1}
li.item.ph{background:var(--paper);outline:2px dashed var(--line);outline-offset:-2px}
li.item.ph>*{visibility:hidden}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:1px solid var(--accent);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,15,.22);list-style:none;margin:0}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
body.is-dragging .group.dropzone .items{border-color:var(--accent)}

/* naam wijzigen */
.item input.edit{flex:1;min-width:0;font:inherit;font-size:1.02rem;color:var(--ink);background:var(--paper);border:1px solid var(--accent);border-radius:8px;padding:6px 8px;margin:-6px 0}

/* al op de lijst: even oplichten */
@keyframes flash{0%,40%{background:var(--warn-soft)}100%{background:transparent}}
li.item.flash{animation:flash 1.8s ease-out}
@media (prefers-reduced-motion: reduce){li.item.flash{animation:none;outline:2px solid var(--warn);outline-offset:-2px}}

/* typfout-vraag */
.panel.typo{border-color:var(--warn)}
.typorow{display:grid;gap:8px}
.typorow+.typorow{border-top:1px solid var(--line);padding-top:10px}
.typorow p{margin:0}
.typorow small{display:block;color:var(--muted);font-size:.8rem}

/* kopen vanaf een datum */
.fromtag{flex:none;font-size:.75rem;font-weight:600;color:var(--sky);background:var(--sky-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.group.later .ghead h3{color:var(--sky)}
.group.later .txt{color:var(--muted)}
.item.editing{flex-wrap:wrap;align-items:flex-start}
.editbox{flex:1 1 200px;min-width:0;display:grid;gap:8px}
.editbox .edit{margin:0}
.fromrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.fromrow input[type=date]{width:auto;flex:1 1 150px;padding:7px 9px}
.fromrow .mini{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;padding:4px 0}
.txtwrap{flex:1;min-width:0;display:grid;gap:3px;justify-items:start}
.txtwrap .txt{width:100%}
.txtwrap .fromtag{padding:2px 7px;font-size:.72rem}

#lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lockbox{width:100%;max-width:340px;display:grid;gap:14px;justify-items:center;text-align:center}
.lockbox h1{font-size:1.8rem}
.lockbox p{margin:0;color:var(--muted)}
.lockbox .btn{width:100%;padding:14px 16px;font-size:1.05rem}
.lockbox .fp{width:64px;height:64px;color:var(--accent);margin-bottom:4px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:6px}
.footbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>

<section id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Boodschappenlijst</h1>
    <p>Vul je naam en de gezamenlijke sleutel in. Dat hoeft maar één keer per telefoon.</p>
    <div class="field">
      <label class="label" for="nameInput">Je naam</label>
      <input type="text" id="nameInput" name="name" placeholder="Bijv. Martijn" maxlength="30" autocomplete="given-name" required>
    </div>
    <div class="field">
      <label class="label" for="codeInput">Sleutel</label>
      <input type="password" id="codeInput" name="password" autocomplete="current-password" required>
    </div>
    <label class="switch" id="bioRow"><input type="checkbox" id="useBio" checked>
      <span>Beveilig met vingerafdruk<small>Bij elke keer openen ontgrendel je de app met je vingerafdruk of gezichtsherkenning.</small></span></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" type="submit" id="loginBtn">Openen</button>
  </form>
</section>

<section id="lock" hidden>
  <div class="lockbox">
    <svg class="fp" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M13 20a11 11 0 0 1 22 0v3"/><path d="M8.5 17.5a16 16 0 0 1 31 0"/><path d="M18 33c1.5-3 2-6.5 2-10a4 4 0 0 1 8 0c0 4-.5 8-2.5 12"/><path d="M24 23c0 6-1.5 11-4.5 15"/><path d="M33 28c-.3 4-1.2 7.5-2.8 10.5"/><path d="M13 25c0 3.5-.8 6.5-2.5 9"/></svg>
    <h1>Boodschappenlijst</h1>
    <p>Ontgrendel met je vingerafdruk.</p>
    <button class="btn" type="button" id="unlockBtn">Ontgrendelen</button>
    <div class="err" id="lockErr" role="alert"></div>
    <button class="linkbtn" type="button" id="relogin">Opnieuw inloggen met de sleutel</button>
  </div>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <div class="top">
      <h1>Boodschappenlijst</h1>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Verbinden…</span></span>
    </div>
    <nav class="chips" id="chips" aria-label="Lijsten"></nav>
  </header>

  <main>
    <form class="panel" id="newList" hidden>
      <label class="lbl" for="newListName">Nieuwe lijst</label>
      <input type="text" id="newListName" placeholder="Bijv. Bakker of Vakantie Frankrijk" maxlength="40" autocomplete="off">
      <div class="kinds" role="radiogroup" aria-label="Soort lijst">
        <label class="kind"><input type="radio" name="kind" id="kindShop" value="shop" checked><b>Boodschappen</b><span>Afvinken in de winkel</span></label>
        <label class="kind"><input type="radio" name="kind" id="kindTrip" value="trip"><b>Vakantie</b><span>Wat mee moet: in huis of nog kopen</span></label>
      </div>
      <div class="row">
        <button class="btn" type="submit">Aanmaken</button>
        <button class="btn sec" type="button" id="newListCancel">Annuleren</button>
      </div>
    </form>

    <section id="listView" class="stack" hidden>
      <div class="listhead">
        <h2><span id="listTitle"></span><span class="sub" id="listSub"></span></h2>
        <button class="ghost" id="manageBtn" type="button" aria-expanded="false">Lijst beheren</button>
      </div>

      <div class="panel" id="manage" hidden>
        <label class="lbl" for="renameInput">Naam van de lijst</label>
        <form class="row" id="renameForm">
          <input type="text" id="renameInput" maxlength="40" autocomplete="off">
          <button class="btn" type="submit">Opslaan</button>
        </form>

        <div id="shopOpts" class="stack" style="gap:12px">
          <div class="divider"></div>
          <label class="switch"><input type="checkbox" id="groupToggle">
            <span>Indelen op AH-looproute<small>Producten worden bij het openen van de app per afdeling gegroepeerd.</small></span></label>
        </div>

        <div id="tripOpts" class="stack" style="gap:12px">
          <div class="divider"></div>
          <div class="row"><button class="btn sec" type="button" id="addTemplate">Veelgebruikte vakantie-items toevoegen</button></div>
          <div class="row" id="resetRow"><button class="btn sec" type="button" id="resetTrip">Opnieuw gebruiken voor volgende vakantie</button></div>
          <div class="row" id="resetConfirm" hidden>
            <span class="confirm">Alle items terug naar "Nog nalopen"? De producten blijven staan.</span>
            <button class="btn" type="button" id="resetYes">Ja, opnieuw beginnen</button>
            <button class="btn sec" type="button" id="resetNo">Nee</button>
          </div>
        </div>

        <div class="divider"></div>
        <div class="row" id="delRow">
          <button class="btn del" type="button" id="delList">Lijst verwijderen</button>
        </div>

const CAT_NAME = Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const CAT_ORDER = Object.fromEntries(CATS.map((c,i)=>[c[0],i]));
const PHRASES = ['douwe egberts','capri sun','hertog jan','red band','lay s','de ruijter','blue band','zeeuws meisje','old amsterdam','old el paso','witte reus','blauwe bessen','rode peper','verse jus','verse pizza','rode ui','witte kool','rode biet','zoete aardappel','jonge kaas','belegen kaas','oude kaas','geraspte kaas','plakken kaas','kipfilet beleg','halfvolle melk','volle melk','griekse yoghurt','creme fraiche','zure room','cottage cheese','bruisend water','ice tea','red bull','ginger ale','jus d orange','rode wijn','witte wijn','alcoholvrij bier','after sun','wc papier','gerookte zalm','bruine bonen','witte bonen','groene thee','dolce gusto','spinazie a la creme','groene zeep','wc blokjes'];
const KW = [];
for(const [cat,,words] of CATS){
  if(!words) continue;
  let rest = ' '+words+' ';
  for(const p of PHRASES){ if(rest.includes(' '+p+' ')){ KW.push({k:p,cat}); rest=rest.replace(' '+p+' ',' '); } }
  rest.trim().split(/\s+/).filter(Boolean).forEach(k=>KW.push({k,cat}));
}
KW.sort((a,b)=>b.k.length-a.k.length);
// Korte of dubbelzinnige woorden tellen alleen als los woord ("port" niet in "sportdrank")
const WHOLE = new Set(['hg','port','rose','peer','cake','pads','cups','mayo','mais','vega','pate']);
const UNITS = new Set('x st stuk stuks kg g gr gram l liter ml cl pak pakken pakje pakjes zak zakje zakjes zakken fles flessen flesje blik blikken blikje bakje bakjes doos doosje dozen pot potje potten krat tray bos bosje net netje rol rollen tube grote kleine groot klein'.split(' '));
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9&\- ]+/g,' ').replace(/\s+/g,' ').trim()}
function itemKey(t){
  const toks = norm(t).split(' ').filter(w=>w && !UNITS.has(w) && !/^\d+([.,]\d+)?(x|kg|g|gr|l|ml|cl|st)?$/.test(w));
  return toks.join(' ') || norm(t);
}
function classify(text){
  const key=itemKey(text), s=' '+key+' ', toks=key.split(' ');
  // 1. Woordcombinaties en hele woorden die precies zo bekend zijn ("rode wijn", "pindakaas", "prei")
  for(const {k,cat} of KW){ if(k.includes(' ')&&s.includes(' '+k+' ')) return cat }
  for(const t of toks){ const hit=KW.find(x=>x.k===t); if(hit) return hit.cat }
  // 2. Samengestelde woorden: het laatste deel bepaalt wat het is (tomaten-soep, kippen-soep, appel-taart)
  let best=null;
  for(const t of toks) for(const {k,cat} of KW){
    if(k.length>=3&&!k.includes(' ')&&t.length>k.length&&t.endsWith(k)&&(!best||k.length>best.k.length)) best={k,cat};
  }
  if(best) return best.cat;
  // 3. Anders: ergens in de naam een bekend woord
  for(const {k,cat} of KW){
    if(k.length<=3||WHOLE.has(k)){ if(new RegExp('[^a-z]'+k.replace(/[-]/g,'\\-')+'[^a-z]').test(s)) return cat; }
    else if(s.includes(k)) return cat;
  }
  return 'overig';
}
function catOf(it){ return (it.cat&&CAT_NAME[it.cat]&&it.cat) || (view.learned && view.learned[itemKey(it.text)]) || classify(it.text) }

/* Veelgebruikte dingen om mee te nemen op vakantie */
const TRIP_TEMPLATE = ['Zonnebrand','Aftersun','Muggenspray','Pleisters','Paracetamol','Tandpasta','Tandenborstels','Shampoo','Douchegel','Deodorant','Billendoekjes','Wasmiddel (reisverpakking)','Afwasmiddel','Keukenrol','Vuilniszakken','Koffie','Thee','Hagelslag','Pindakaas','Crackers','Koekjes voor onderweg','Chips voor onderweg','Fruit voor onderweg','Water voor onderweg','Drinkpakjes','Batterijen'];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function parse(s){try{return JSON.parse(s)}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Eerste letter een hoofdletter ("melk" → "Melk", "2 pak eieren" blijft "2 pak eieren")
function cap(t){if(!t) return t; if(/^ij/.test(t)) return 'IJ'+t.slice(2); return t.charAt(0).toLocaleUpperCase('nl-NL')+t.slice(1)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
let toastT; function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}

const UI = {current:lsGet('bs-current'), showDone:true, loaded:false,
            openedAt:Date.now(), addedHere:new Set(), placed:new Set(), hiddenAt:null,
            editing:null, target:lsGet('bs-target'), dragging:false, renderPending:false};

/* ---------- weergave ---------- */
function kindOf(l){return l&&l.kind==='trip'?'trip':'shop'}
function lists(){return Object.values(view.lists).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0))}
function shopLists(){return lists().filter(l=>kindOf(l)==='shop')}
function itemsOf(id){return Object.values(view.items).filter(i=>i.listId===id)}
function sortKey(i){return typeof i.pos==='number'?i.pos:(i.createdAt||0)}
function bySort(a,b){return sortKey(a)-sortKey(b)||String(a.id).localeCompare(String(b.id))}
function isGrouped(l){
  if(kindOf(l)!=='shop') return false;
  if(typeof l.grouped==='boolean') return l.grouped;
  return l.id==='supermarkt'||/supermarkt|albert heijn|(^|\s)ah(\s|$)/i.test(l.name);
}
function openCount(l){const its=itemsOf(l.id).filter(i=>!isLater(i));return kindOf(l)==='trip'?its.filter(i=>i.status!=='packed').length:its.filter(i=>!i.done).length}
function isFresh(i){return !UI.placed.has(i.id)&&(UI.addedHere.has(i.id)||(i.createdAt||0)>UI.openedAt)}

function render(){
  if(UI.dragging||UI.editing){UI.renderPending=true;return}
  UI.renderPending=false;
  const ls=lists();
  if(UI.current&&!view.lists[UI.current]) UI.current=null;
  if(!UI.current&&ls.length) UI.current=ls[0].id;

  $('chips').innerHTML=ls.map(l=>{const n=openCount(l);
    return '<button class="chip" type="button" data-list="'+esc(l.id)+'" aria-current="'+(l.id===UI.current)+'">'+(kindOf(l)==='trip'?SUITCASE:'')+esc(l.name)+(n?'<span class="n">'+n+'</span>':'')+'</button>';
  }).join('')+'<button class="chip add" type="button" id="addListChip">+ Nieuwe lijst</button>';
  const who=$('whoami'); if(who) who.textContent=byValue()&&whoName(byValue())?'Op deze telefoon: '+whoName(byValue()):'';

  if(!ls.length){
    $('listView').hidden=true; $('emptyAll').hidden=false;
    $('emptyAll').innerHTML=UI.loaded
      ?'<div class="empty"><strong>Nog geen lijsten</strong>Maak een lijst per winkel, of een vakantielijst.<br><button class="btn" type="button" id="firstList">Eerste lijst maken</button></div>'
      :'<div class="empty"><strong>Lijsten laden…</strong>Jullie lijsten verschijnen hier.</div>';
    return;
  }
  $('emptyAll').hidden=true; $('listView').hidden=false;

  const l=view.lists[UI.current], trip=kindOf(l)==='trip';
  $('listTitle').textContent=l.name;
  $('shopWrap').hidden=trip; $('tripWrap').hidden=!trip;
  $('itemText').placeholder=trip?'Wat moet er mee op vakantie?':'Wat moet er mee?';
  $('hint').textContent=trip
    ?'Geef per item aan of het al in huis is of nog gekocht moet worden. Tik op een naam om die te wijzigen, sleep aan de puntjes om te verplaatsen.'
    :(isGrouped(l)?'Komma\'s voor meerdere tegelijk. Nieuwe producten worden bij het volgende openen op AH-looproute ingedeeld. Tik op een naam om die te wijzigen. Sleep aan de puntjes om iets naar een andere plek of afdeling te verplaatsen.'
                  :'Meerdere tegelijk met komma\'s. Tik op een naam om die te wijzigen, sleep aan de puntjes om de volgorde aan te passen.');
  if(trip) renderTrip(l); else renderShop(l);
}

function gripHtml(i){return '<button class="grip" type="button" aria-label="Verplaats '+esc(i.text)+' (pijltjestoetsen of slepen)">'+GRIP+'</button>'}
function txtHtml(i){return '<button class="txt" type="button" data-edit="1" aria-label="'+esc(i.text)+', naam wijzigen">'+esc(i.text)+'</button>'}
function fromHtml(i){return i.from&&(isLater(i)||i.status)?'<span class="fromtag">vanaf '+esc(fmtDate(i.from))+'</span>':''}
function withFrom(txt,i){const f=fromHtml(i);return f?'<span class="txtwrap">'+txt+f+'</span>':txt}
function whoHtml(i){const n=i.by?whoName(i.by):'';return n?'<span class="who" title="Toegevoegd door '+esc(n)+'">'+esc(n.trim().charAt(0).toUpperCase())+'</span>':''}

function rowShop(i,grouped){
  const txt=txtHtml(i);
  return '<li class="item'+(i.done?' done':'')+'" data-id="'+esc(i.id)+'">'+(i.done?'':gripHtml(i))
    +'<button class="check" type="button" data-act="done" aria-pressed="'+!!i.done+'" aria-label="'+(i.done?'Terugzetten: ':'Afvinken: ')+esc(i.text)+'">'+CHECK+'</button>'
    +withFrom(txt,i)+whoHtml(i)+'<button class="x" type="button" data-act="del" aria-label="Verwijder '+esc(i.text)+'">'+XSVG+'</button></li>';
}

function renderShop(l){
  const all=itemsOf(l.id), grouped=isGrouped(l);
  const later=all.filter(i=>!i.done&&isLater(i)).sort((a,b)=>a.from.localeCompare(b.from)||bySort(a,b));
  const todo=all.filter(i=>!i.done&&!isLater(i)).sort(bySort);
  const done=all.filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  $('listSub').textContent=grouped&&todo.length?'Ingedeeld op AH-looproute':'';
  let html;
  if(!todo.length){
    html='<div class="empty">'+(later.length?'<strong>Nu niets te halen</strong>Alles op deze lijst is voor later.':done.length?'<strong>Alles is afgevinkt</strong>Klaar met deze lijst.':'<strong>Deze lijst is leeg</strong>Typ hierboven wat je nodig hebt.')+'</div>';
  }else if(!grouped){
    html='<ul class="items" data-zone="todo">'+todo.map(i=>rowShop(i,false)).join('')+'</ul>';
  }else{
    // Wat sinds het openen is toegevoegd blijft bovenaan staan; bij het volgende openen wordt het ingedeeld.
    const fresh=todo.filter(isFresh), settled=todo.filter(i=>!isFresh(i));
    const groups={};
    settled.forEach(i=>{const c=catOf(i);(groups[c]=groups[c]||[]).push(i)});
    const order=Object.keys(groups).sort((a,b)=>(CAT_ORDER[a]??99)-(CAT_ORDER[b]??99));

/* ---------- naam wijzigen ----------
   Tik op een product: de naam wordt een invoerveld. Enter of ergens anders tikken = opslaan, Esc = annuleren. */
function startEdit(li,it){
  const t=li.querySelector('.txt'); if(!t) return;
  const box=document.createElement('div'); box.className='editbox';
  box.innerHTML='<input type="text" class="edit" id="edit-'+esc(it.id)+'" maxlength="200" enterkeyhint="done" aria-label="Naam">'
    +'<div class="fromrow"><label for="from-'+esc(it.id)+'">Kopen vanaf</label><input type="date" id="from-'+esc(it.id)+'">'
    +'<button type="button" class="mini" data-clear="1">Geen datum</button></div>'
    +'<div class="row"><button type="button" class="btn" data-save="1">Opslaan</button><button type="button" class="btn sec" data-cancel="1">Annuleren</button></div>';
  t.replaceWith(box); li.classList.add('editing'); UI.editing=it.id;
  const inp=box.querySelector('.edit'), dt=box.querySelector('input[type=date]');
  inp.value=it.text; dt.value=it.from||''; dt.min=todayStr();
  inp.focus(); try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}
  let closed=false;
  const finish=save=>{
    if(closed) return; closed=true; UI.editing=null; li.classList.remove('editing');
    const v=cap(inp.value.trim().replace(/\s+/g,' ').slice(0,200)), f=dt.value||null, ops=[];
    if(save&&v&&v!==it.text) ops.push({type:'renameItem',id:it.id,text:v});
    if(save&&f!==(it.from||null)) ops.push({type:'setFrom',id:it.id,from:f});
    if(ops.length){queue(ops); if(f&&f!==(it.from||null)&&f>todayStr()) toast('"'+(v||it.text)+'" staat onder Later kopen, vanaf '+fmtDate(f)+'.')}
    else render();
  };
  box.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target===inp){e.preventDefault();finish(true)}
    else if(e.key==='Escape'){e.preventDefault();finish(false)}
  });
  box.addEventListener('click',e=>{
    if(e.target.closest('[data-save]')) finish(true);
    else if(e.target.closest('[data-cancel]')) finish(false);
    else if(e.target.closest('[data-clear]')){dt.value='';inp.focus()}
  });
  // Ergens anders tikken = opslaan
  box.addEventListener('focusout',e=>{ if(!box.contains(e.relatedTarget)) setTimeout(()=>{ if(!box.contains(document.activeElement)) finish(true) },150) });
}

/* ---------- kopen vanaf een datum ---------- */
const MONTHS={jan:1,januari:1,feb:2,februari:2,mrt:3,maart:3,apr:4,april:4,mei:5,jun:6,juni:6,jul:7,juli:7,aug:8,augustus:8,sep:9,sept:9,september:9,okt:10,oktober:10,nov:11,november:11,dec:12,december:12};
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isLater(i){return !!i.from&&i.from>todayStr()}
function fmtDate(iso){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})+(y!==new Date().getFullYear()?' '+y:'')}
function mkDate(d,m,y){
  if(!(m>=1&&m<=12&&d>=1&&d<=31)) return null;
  const now=new Date(); let yy=y?(y<100?2000+y:y):now.getFullYear();
  let dt=new Date(yy,m-1,d); if(dt.getMonth()!==m-1) return null;
  if(!y&&dt<new Date(now.getFullYear(),now.getMonth(),now.getDate())) dt=new Date(yy+1,m-1,d); // al voorbij: volgend jaar
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
}
// "kerstkransjes vanaf 1 december" / "oliebollen vanaf 28-12" → {text, from}
function splitFrom(text){
  const m=text.match(/^(.*?)\s+(?:vanaf|v\.a\.|va)\s+(.+)$/i); if(!m) return {text,from:null};
  const rest=m[2].trim().toLowerCase().replace(/\.$/,'');
  let r=rest.match(/^(\d{1,2})\s*[-\/.]\s*(\d{1,2})(?:\s*[-\/.]\s*(\d{2,4}))?$/), from=null;
  const DAYS={zondag:0,zo:0,maandag:1,ma:1,dinsdag:2,di:2,woensdag:3,wo:3,donderdag:4,do:4,vrijdag:5,vr:5,zaterdag:6,za:6};
  const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  if(rest==='morgen') from=plus(1);
  else if(rest==='overmorgen') from=plus(2);
  else if(rest==='volgende week') from=plus(7);
  else if(rest in DAYS){let n=(DAYS[rest]-new Date().getDay()+7)%7; from=plus(n||7)}
  else if(r) from=mkDate(+r[1],+r[2],r[3]?+r[3]:null);
  else if((r=rest.match(/^(\d{1,2})\s+([a-z]+)\.?(?:\s+(\d{4}))?$/))&&MONTHS[r[2]]) from=mkDate(+r[1],MONTHS[r[2]],r[3]?+r[3]:null);
  return from?{text:m[1].trim(),from}:{text,from:null};
}

/* ---------- acties ---------- */
function addItems(raw){
  const parts=raw.split(',').map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean).map(s=>{const r=splitFrom(s);r.text=cap(r.text);return r}).filter(r=>r.text);
  if(!parts.length||!UI.current) return;
  const l=view.lists[UI.current], trip=kindOf(l)==='trip';
  // Wat staat er al op deze lijst? (vergelijken zonder hoeveelheden: "2 pak melk" = "melk")
  const existing=new Map();
  itemsOf(UI.current).forEach(i=>{const k=itemKey(i.text); if(!existing.has(k)||!i.done) existing.set(k,i)});
  const ops=[], already=[], back=[], seen=new Set();
  for(const {text,from} of parts){
    const k=itemKey(text);
    if(seen.has(k)) continue; seen.add(k);
    const hit=existing.get(k);
    if(hit&&!trip&&hit.done){ops.push({type:'setDone',id:hit.id,done:false});back.push(hit);continue}
    if(hit){already.push(hit);continue}
    ops.push(Object.assign({type:'addItem',id:newId(),listId:UI.current,text:text.slice(0,200),by:byValue()},from?{from}:{}));
  }
  const dated=ops.filter(o=>o.from);
  ops.forEach(op=>{if(op.type==='addItem') UI.addedHere.add(op.id)});
  if(ops.length) queue(ops);
  checkTypos(ops.filter(o=>o.type==='addItem'));
  const names=a=>a.map(i=>'"'+i.text+'"').join(', ').replace(/, ([^,]*)$/,' en $1');
  const msg=[];
  if(already.length) msg.push(names(already)+(already.length===1?' staat':' staan')+' al op de lijst');
  if(back.length) msg.push(names(back)+(back.length===1?' lag':' lagen')+' al in de kar en '+(back.length===1?'staat':'staan')+' weer op de lijst');
  if(dated.length&&!msg.length) toast(dated.length===1?'"'+dated[0].text+'" staat onder Later kopen, vanaf '+fmtDate(dated[0].from)+'.':dated.length+' producten staan onder Later kopen.');
  if(msg.length){
    const added=ops.filter(o=>o.type==='addItem').length;
    toast(msg.join('. ')+(added?'. De rest is toegevoegd.':'.'));
    requestAnimationFrame(()=>[...already,...back].forEach(i=>{
      const li=document.querySelector('li.item[data-id="'+CSS.escape(i.id)+'"]');
      if(li){li.classList.remove('flash');void li.offsetWidth;li.classList.add('flash')}
    }));
  }
}
/* ---------- typfouten ----------
   Een woord dat de app niet kent en dat 1 letter (lange woorden: 2 letters) verschilt van een
   bekend product, levert een vraag op: "Bedoel je ...?". Nooit automatisch verbeteren. */
const EXTRA_WORDS='bio biologisch biologische geroosterde gebrande ongezoete gezoete gepelde gekookte gegrilde gemarineerde gezouten ongezouten halfvolle magere volle verse vers verse mini maxi extra light zero naturel zout zoet zoete pittig gerookt gerookte gemalen geraspt gesneden mager magere halfvol halfvolle vol volle ongezouten gezouten rood rode wit witte groen groene geel gele bruin bruine zwart zwarte grote kleine fijn fijne grof grove plakjes blokjes stukjes reepjes sate saus kip rund varken lam ijs cola thee koffie water melk brood kaas vis vlees ei eieren pak pakje zak fles pot blik doos bak bakje rol tube voor onderweg de het een en met zonder van'.split(' ');
// Merken met producten in meerdere afdelingen: geen afdeling, maar ook geen typfout
const BRANDS='honig calve unox knorr maggi bertolli oetker lotus bolletje lipton ah albert heijn euroshopper smaakt gwoon lays kellogg kelloggs gotan hellmanns zonnatura verstegen grand italia jumbo lidl aldi jerrys ben'.split(' ');
const OK_KEY='bs-known-words';
function knownWords(){return new Set(parse(lsGet(OK_KEY))||[])}
function rememberWord(w){const k=knownWords();k.add(w);lsSet(OK_KEY,JSON.stringify([...k].slice(-500)))}
function vocab(excludeIds){
  const v=new Set(EXTRA_WORDS.concat(BRANDS));
  KW.forEach(x=>x.k.split(' ').forEach(w=>w.length>1&&v.add(w)));
  Object.keys(view.learned||{}).forEach(k=>k.split(' ').forEach(w=>v.add(w)));
  Object.values(view.items).forEach(i=>{if(!excludeIds.has(i.id)) itemKey(i.text).split(' ').forEach(w=>v.add(w))});
  knownWords().forEach(w=>v.add(w));
  return v;
}
function osa(a,b){ // aantal letters verschil (incl. omgedraaide letters)
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9;
  const d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function isKnown(t,v){
  if(v.has(t)) return true;
  const base=t.replace(/(tjes|tje|jes|je)$/,''); if(base.length>=3&&v.has(base)) return true; // verkleinwoord
  for(const w of v){ if(w.length>=4&&t.length-w.length>=3&&(t.endsWith(w)||t.startsWith(w))) return true } // samengesteld woord
  return false;
}
function suggestWord(t,v){
  if(t.length<4||/\d/.test(t)||isKnown(t,v)) return null;
  const max=t.length>=8?2:1; let best=null,bd=9;
  for(const w of v){ if(w.length<3) continue; const d=osa(t,w); if(d<bd||(d===bd&&best&&w.length===t.length&&best.length!==t.length)){bd=d;best=w} }
  return bd<=max?best:null;
}
function checkTypos(addOps){
  if(!addOps.length) return;
  const ids=new Set(addOps.map(o=>o.id)), v=vocab(ids), found=[];
  for(const op of addOps){
    const words=norm(op.text).split(' ');
    for(const t of words){
      const sug=suggestWord(t,v); if(!sug) continue;
      const re=new RegExp('(^|[^\\p{L}])'+t.replace(/[-]/g,'\\-')+'(?=$|[^\\p{L}])','iu');
      const fixed=cap(op.text.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(re,(m,p)=>p+sug));
      if(fixed!==op.text){found.push({id:op.id,from:op.text,to:fixed,word:t});break}
    }
  }
  if(found.length) showTypos(found);
}
function showTypos(list){
  let d=$('typoPanel');
  if(!d){d=document.createElement('div');d.className='panel typo';d.id='typoPanel';document.querySelector('main').prepend(d)}
  const prev=(d._list||[]).filter(x=>view.items[x.id]);
  d._list=prev.concat(list.filter(x=>!prev.some(p=>p.id===x.id)));
  const draw=()=>{
    d._list=d._list.filter(x=>view.items[x.id]);
    if(!d._list.length){d.remove();return}
    d.innerHTML='<label class="lbl">Typfout?</label>'+d._list.map((x,i)=>
      '<div class="typorow"><p>Bedoel je <b>'+esc(x.to)+'</b>?<small>Je typte: '+esc(x.from)+'</small></p>'
      +'<div class="row"><button class="btn" type="button" data-fix="'+i+'">Verbeteren</button><button class="btn sec" type="button" data-keep="'+i+'">Klopt zo</button></div></div>').join('');
  };
  draw();
  d.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const x=d._list[+(b.dataset.fix??b.dataset.keep)]; if(!x) return;
    d._list=d._list.filter(y=>y!==x);
    if(b.dataset.keep!==undefined){rememberWord(x.word);toast('"'+x.from+'" blijft zo staan. De app onthoudt dit woord.')}
    else{
      const it=view.items[x.id];
      const dup=it&&itemsOf(it.listId).find(i=>i.id!==it.id&&!i.done&&itemKey(i.text)===itemKey(x.to));
      if(dup){act({type:'deleteItem',id:x.id});toast('"'+dup.text+'" stond al op de lijst.')}
      else if(it){act({type:'renameItem',id:x.id,text:x.to});toast('Verbeterd naar "'+x.to+'".')}
    }
    draw();
  };
}

/* ---------- slepen ----------
   Pak een product aan de zes puntjes en sleep het. In de Supermarkt kun je het naar een andere
   afdeling slepen (de app onthoudt dat); op de vakantielijst naar een andere stap. */
const drag={on:false};
function rowsIn(ul){return [...ul.children].filter(li=>li.matches('li.item'))}
function newPos(prev,next){
  if(prev&&next) return (sortKey(prev)+sortKey(next))/2;
  if(prev) return sortKey(prev)+1000;
  if(next) return sortKey(next)-1000;
  return Date.now();
}
function moveOp(it,ul,prev,next){
  const op={type:'move',id:it.id,pos:newPos(prev,next)};
  if(ul.dataset.zone==='todo'&&ul.dataset.cat&&ul.dataset.cat!=='new'){
    UI.placed.add(it.id);
    if(ul.dataset.cat!==catOf(it)){op.cat=ul.dataset.cat;op.key=itemKey(it.text)}
  }
  if(ul.dataset.zone==='trip'&&ul.dataset.status&&ul.dataset.status!==(it.status||'open')) op.status=ul.dataset.status;
  return op;
}
const mainEl=document.querySelector('main');
mainEl.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip'); if(!g||(e.pointerType==='mouse'&&e.button!==0)) return;
  const li=g.closest('li.item'), ul=li&&li.parentNode; if(!ul||!ul.dataset||!ul.dataset.zone) return;
  e.preventDefault();
  const r=li.getBoundingClientRect();
  const ghost=li.cloneNode(true); ghost.classList.add('drag-ghost');
  Object.assign(ghost.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});
  document.body.appendChild(ghost);
  li.classList.add('ph');
  Object.assign(drag,{on:true,li,ghost,id:li.dataset.id,zone:ul.dataset.zone,startUl:ul,startPrev:li.previousElementSibling,
    dy:e.clientY-r.top,y:e.clientY,x:r.left+r.width/2,pid:e.pointerId});
  UI.dragging=true; document.body.classList.add('is-dragging');
  drag.raf=requestAnimationFrame(dragTick);
});
window.addEventListener('pointermove',e=>{if(drag.on&&e.pointerId===drag.pid){drag.y=e.clientY;e.preventDefault()}},{passive:false});
window.addEventListener('pointerup',e=>{if(drag.on&&e.pointerId===drag.pid) endDrag(false)});
window.addEventListener('pointercancel',e=>{if(drag.on&&e.pointerId===drag.pid) endDrag(true)});
document.addEventListener('touchmove',e=>{if(drag.on) e.preventDefault()},{passive:false});
function dragTick(){
  if(!drag.on) return;
  const hdr=document.querySelector('header').getBoundingClientRect().bottom, H=window.innerHeight;
  let v=0;
  if(drag.y<hdr+60) v=-Math.min(18,Math.ceil((hdr+60-drag.y)/4));
  else if(drag.y>H-70) v=Math.min(18,Math.ceil((drag.y-(H-70))/4));
  if(v) window.scrollBy(0,v);
  drag.ghost.style.top=(drag.y-drag.dy)+'px';
  placeHolder();
  drag.raf=requestAnimationFrame(dragTick);
}
function placeHolder(){
  const el=document.elementFromPoint(drag.x,drag.y); if(!el) return;
  let ul=el.closest('ul[data-zone]'); const li=el.closest('li.item');
  if(!ul){const g=el.closest('.group'); ul=g&&g.querySelector('ul[data-zone]')}
  if(!ul||ul.dataset.zone!==drag.zone) return;
  document.querySelectorAll('.group.dropzone').forEach(g=>g.classList.remove('dropzone'));
  const grp=ul.closest('.group'); if(grp) grp.classList.add('dropzone');
  if(li&&li!==drag.li&&li.parentNode===ul){
    const r=li.getBoundingClientRect();
    if(drag.y<r.top+r.height/2){ if(li.previousElementSibling!==drag.li) ul.insertBefore(drag.li,li) }
    else if(li.nextElementSibling!==drag.li) ul.insertBefore(drag.li,li.nextSibling);
  }else if(!li&&drag.li.parentNode!==ul){
    const r=ul.getBoundingClientRect();
    if(drag.y<r.top+r.height/2) ul.insertBefore(drag.li,ul.firstChild); else ul.appendChild(drag.li);
  }
}
function endDrag(cancel){
  drag.on=false; cancelAnimationFrame(drag.raf);
  drag.ghost.remove(); drag.li.classList.remove('ph');
  document.body.classList.remove('is-dragging');
  document.querySelectorAll('.group.dropzone').forEach(g=>g.classList.remove('dropzone'));
  UI.dragging=false;
  const ul=drag.li.parentNode, it=view.items[drag.id];
  const unchanged=ul===drag.startUl&&drag.li.previousElementSibling===drag.startPrev;
  if(cancel||!it||unchanged){render();return}
  const sib=rowsIn(ul), i=sib.indexOf(drag.li);
  const prev=sib[i-1]&&view.items[sib[i-1].dataset.id], next=sib[i+1]&&view.items[sib[i+1].dataset.id];
  act(moveOp(it,ul,prev,next));
}

/* Zelfde regels als api.php, zodat het scherm direct klopt, ook offline */
function applyOp(s, op){
  const now = op.t || Date.now();
  const it = op.id ? s.items[op.id] : null;
  switch(op.type){
    case 'addList':
      if(!s.lists[op.id]){const order=Object.values(s.lists).reduce((m,l)=>Math.max(m,l.order||0),0)+1;
        s.lists[op.id]={id:op.id,name:op.name,kind:op.kind==='trip'?'trip':'shop',order,createdAt:now}}
      break;
    case 'renameList': if(s.lists[op.id]) s.lists[op.id].name=op.name; break;
    case 'setGrouped': if(s.lists[op.id]) s.lists[op.id].grouped=!!op.grouped; break;
    case 'deleteList':
      delete s.lists[op.id];
      for(const k in s.items) if(s.items[k].listId===op.id) delete s.items[k];
      break;
    case 'addItem': {
      const l=s.lists[op.listId]; if(!l||s.items[op.id]) break;
      const n={id:op.id,listId:op.listId,text:op.text,by:op.by||'',createdAt:now};
      if(op.from) n.from=op.from;
      if(kindOf(l)==='trip'){n.status='open';n.sentTo=null}
      else{n.done=false;n.doneAt=null;
        const src=op.fromTrip&&s.items[op.fromTrip];
        if(src&&kindOf(s.lists[src.listId])==='trip'){n.fromTrip=op.fromTrip;src.sentTo=op.id}}
      s.items[op.id]=n; break; }
    case 'setDone':
      if(it&&!!it.done!==!!op.done){it.done=!!op.done;it.doneAt=op.done?now:null;
        const trip=it.fromTrip&&s.items[it.fromTrip];
        if(trip){ if(op.done&&trip.status==='buy') trip.status='home';
                  else if(!op.done&&trip.status==='home'&&trip.sentTo===it.id) trip.status='buy'; }}
      break;
    case 'setStatus': if(it&&it.status) it.status=op.status; break;
    case 'resetTrip': for(const k in s.items){const x=s.items[k]; if(x.listId===op.listId&&x.status){x.status='open';x.sentTo=null}} break;
    case 'setCategory': if(it){it.cat=op.cat; if(op.key) s.learned[op.key]=op.cat} break;
    case 'move':
      if(it){it.pos=op.pos;
        if(op.cat){it.cat=op.cat; if(op.key) s.learned[op.key]=op.cat}
        if(op.status&&it.status) it.status=op.status}
      break;
    case 'renameItem': if(it&&op.text) it.text=op.text; break;
    case 'setFrom': if(it){ if(op.from) it.from=op.from; else delete it.from } break;
    case 'deleteItem': delete s.items[op.id]; break;
    case 'clearDone': for(const k in s.items){const x=s.items[k];if(x.listId===op.listId&&x.done) delete s.items[k]} break;
  }
}

/* ===== Vergrendeling met vingerafdruk (passkey + PRF) =====
   Bij het instellen maakt de telefoon een passkey aan. Elke keer dat je ontgrendelt, levert de
   passkey (na je vingerafdruk) een geheime waarde op waarmee de sleutel én de bewaarde lijsten
   worden ontsleuteld. Zonder vingerafdruk staat er op de telefoon alleen versleutelde data. */
const LOCK_KEY='bs-lock';
const RELOCK_AFTER=60000; // na een minuut op de achtergrond weer vergrendelen
let vaultKey=null, sealChain=Promise.resolve(), bgSince=null;

function lockOn(){return !!lsGet(LOCK_KEY)}
function lockInfo(){return parse(lsGet(LOCK_KEY))}
const enc=new TextEncoder(), dec=new TextDecoder();
function toB64(buf){let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}

async function prfKey(out){
  const base=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:enc.encode('boodschappenlijst-v1')},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function passkeyPrf(credId,salt){
  const cred=await navigator.credentials.get({publicKey:{
    challenge:rnd(32), rpId:location.hostname, userVerification:'required', timeout:60000,
    allowCredentials:[{type:'public-key',id:credId}],
    extensions:{prf:{eval:{first:salt}}}}});
  const r=cred.getClientExtensionResults();
  const out=r&&r.prf&&r.prf.results&&r.prf.results.first;
  if(!out) throw Object.assign(new Error('noprf'),{code:'noprf'});
  return out;
}
function sealVault(){
  if(!vaultKey) return sealChain;
  const key=vaultKey, payload=JSON.stringify({token,server,pending});
  sealChain=sealChain.then(async()=>{
    const info=lockInfo(); if(!info) return;
    const iv=rnd(12);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(payload));
    info.iv=toB64(iv); info.ct=toB64(ct); lsSet(LOCK_KEY,JSON.stringify(info));
  }).catch(()=>{});
  return sealChain;
}
function wipePlain(){lsDel(K.token);lsDel(K.server);lsDel(K.pending)}
function bioAvailable(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}

/* Instellen: passkey maken en de huidige gegevens versleutelen */
async function enableLock(){
  if(!bioAvailable()){toast('Deze telefoon ondersteunt geen ontgrendelen met vingerafdruk in de browser.');return false}
  try{
    const salt=rnd(32);
    const cred=await navigator.credentials.create({publicKey:{
      challenge:rnd(32), rp:{name:'Boodschappenlijst',id:location.hostname},
      user:{id:rnd(16),name:(myName||'gebruiker')+' · Boodschappenlijst',displayName:myName||'Boodschappenlijst'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},
      timeout:60000, extensions:{prf:{eval:{first:salt}}}}});
    const ext=cred.getClientExtensionResults();
    if(ext&&ext.prf&&ext.prf.enabled===false) throw Object.assign(new Error('noprf'),{code:'noprf'});
    let out=ext&&ext.prf&&ext.prf.results&&ext.prf.results.first;
    if(!out) out=await passkeyPrf(new Uint8Array(cred.rawId),salt); // sommige telefoons geven de waarde pas bij de eerste keer ontgrendelen
    vaultKey=await prfKey(out);
    lsSet(LOCK_KEY,JSON.stringify({credId:toB64(cred.rawId),salt:toB64(salt)}));
    await sealVault(); wipePlain(); updateLockBtn();
    toast('Vingerafdruk ingesteld. Voortaan ontgrendel je de app hiermee.');
    return true;
  }catch(e){
    vaultKey=null; lsDel(LOCK_KEY); updateLockBtn();
    toast(e&&e.code==='noprf'
      ?'Je wachtwoordbeheerder ondersteunt dit niet. Gebruik die van Google (Android) of iCloud-sleutelhanger (iPhone). De app werkt nu zonder vingerafdruk.'
      :'Vingerafdruk instellen is niet gelukt. De app werkt nu zonder vingerafdruk; je kunt het onderaan opnieuw proberen.');
    return false;
  }
}
async function disableLock(){
  await sealChain; lsDel(LOCK_KEY); vaultKey=null;
  lsSet(K.token,token); lsSet(K.server,JSON.stringify(server)); lsSet(K.pending,JSON.stringify(pending));
  updateLockBtn(); toast('Vingerafdruk uitgezet.');
}

/* Ontgrendelen */
let unlocking=false;
async function unlock(){
  if(unlocking) return; unlocking=true;
  $('lockErr').textContent=''; $('unlockBtn').disabled=true;
  try{
    const info=lockInfo();
    const out=await passkeyPrf(fromB64(info.credId),fromB64(info.salt));
    const key=await prfKey(out);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(info.iv)},key,fromB64(info.ct));
    const v=JSON.parse(dec.decode(plain));
    vaultKey=key; token=v.token; server=fixState(v.server)||emptyState(); pending=v.pending||[];
    UI.loaded=server.version>0; sha=null; etag=null;
    $('lock').hidden=true; showApp();
  }catch(e){
    $('lockErr').textContent = e&&e.name==='NotAllowedError'?'Niet ontgrendeld. Tik op de knop om het opnieuw te proberen.'
      : e&&e.code==='noprf'?'Deze passkey kan de app niet ontgrendelen. Log opnieuw in met de sleutel.'
      : 'Ontgrendelen lukte niet. Probeer het opnieuw of log opnieuw in met de sleutel.';
  }
  $('unlockBtn').disabled=false; unlocking=false;
}
function showLock(msg,auto){
  $('app').hidden=true; $('login').hidden=true; $('lock').hidden=false;
  $('lockErr').textContent=msg||'';
  if(auto) setTimeout(unlock,250);
}
async function relock(){
  await sealChain;
  vaultKey=null; token=null; server=emptyState(); pending=[]; view=null; sha=null; etag=null;
  closeManage(); $('newList').hidden=true;
  showLock('',true);
}
$('unlockBtn').addEventListener('click',unlock);
$('relogin').addEventListener('click',()=>{lsDel(LOCK_KEY);vaultKey=null;logout('Log opnieuw in met je naam en de sleutel.')});
document.addEventListener('visibilitychange',()=>{
  if(!lockOn()) return;
  if(document.hidden){bgSince=Date.now();flush();sealVault();return}
  if(vaultKey&&bgSince&&Date.now()-bgSince>=RELOCK_AFTER) relock();
  bgSince=null;
});

/* ===== Opslaglaag: privé GitHub-repository =====
   De app staat op GitHub Pages; jullie lijsten staan als één bestand (data.json) in een
   privé-repository. Elke telefoon logt één keer in met de gezamenlijke sleutel (een
   fine-grained token met alleen toegang tot die ene repository).
   server  = laatst bekende stand van GitHub
   pending = wijzigingen die nog niet zijn opgeslagen (blijven bewaard als je offline bent)
   view    = server + pending, dat zie je op het scherm */
const GH_API = 'https://api.github.com';
const DATA_REPO = 'mchielsen/boodschappenlijst-data';
const DATA_FILE = 'data.json';
const K = {token:'bs-gh-token', name:'bs-name', server:'bs-server', pending:'bs-pending'};
let token = lsGet(K.token);
let myName = lsGet(K.name) || '';
let server = fixState(parse(lsGet(K.server))) || emptyState();
let pending = parse(lsGet(K.pending)) || [];
let view = null;
let net = 'idle';
let sha = null, etag = null;
UI.loaded = server.version>0;

function byValue(){return myName}
function whoName(by){return by||''}
function onVisible(){poll()}

function emptyState(){return {version:0, lists:{}, items:{}, learned:{}}}
function defaultState(){
  const t=Date.now(), s={version:0, lists:{}, items:{}, learned:{}};
  [['supermarkt','Supermarkt'],['drogist','Drogist'],['markt','Markt']].forEach(([id,name],i)=>{s.lists[id]={id,name,kind:'shop',order:i+1,createdAt:t+i}});
  return s;
}
function fixState(s){
  if(!s||typeof s!=='object') return null;
  if(!s.lists||Array.isArray(s.lists)) s.lists={};
  if(!s.items||Array.isArray(s.items)) s.items={};
  if(!s.learned||Array.isArray(s.learned)) s.learned={};
  s.version=+s.version||0; return s;
}
function persist(){
  if(lockOn()){sealVault();return} // met vingerafdruk: alleen versleuteld bewaren
  lsSet(K.server,JSON.stringify(server));lsSet(K.pending,JSON.stringify(pending));
}
function recompute(){view=JSON.parse(JSON.stringify(server));pending.forEach(op=>applyOp(view,op))}
let flushT=null;
function queue(ops){
  const t=Date.now(); ops.forEach((op,i)=>{op.t=t+i;pending.push(op)});
  persist(); recompute(); render();
  clearTimeout(flushT); flushT=setTimeout(flush,600); // snelle tikken samen in één keer opslaan
}
function act(op){queue([op])}

/* ---------- GitHub ---------- */
function b64encode(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64decode(b64){const s=atob(String(b64).replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
class ApiError extends Error{constructor(kind,status){super(kind);this.kind=kind;this.status=status}}
async function gh(method, body, useToken, extra){
  let res;
  const headers={'Authorization':'Bearer '+(useToken||token||''),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body) headers['Content-Type']='application/json';
  Object.assign(headers, extra||{});
  try{
    res=await fetch(GH_API+'/repos/'+DATA_REPO+'/contents/'+DATA_FILE, {method, cache:'no-store', headers, body:body?JSON.stringify(body):undefined});
  }catch(e){throw new ApiError('offline',0)}
  if(res.status===304) return {unchanged:true};
  let data=null; try{data=await res.json()}catch(e){}
  if(res.status===401) throw new ApiError('token',401);
  if(res.status===403||res.status===429){
    if(res.headers.get('x-ratelimit-remaining')==='0'||res.status===429) throw new ApiError('rate',res.status);
    throw new ApiError('forbidden',403); // vaak tijdelijk (GitHub of mobiel netwerk)
  }
  if(res.status===404&&method==='GET') return {missing:true};
  if(res.status===404) throw new ApiError('notfound',404);
  if(res.status===409||res.status===422) throw new ApiError('conflict',res.status);
  if(!res.ok||!data) throw new ApiError('server',res.status);
  return {data, etag:res.headers.get('etag')};
}
// Controleert of de sleutel toegang heeft tot de privé-repository (een lege opslag geeft anders hetzelfde "niet gevonden").
async function checkAccess(useToken){
  let res;
  try{res=await fetch(GH_API+'/repos/'+DATA_REPO,{cache:'no-store',headers:{'Authorization':'Bearer '+useToken,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}})}
  catch(e){throw new ApiError('offline',0)}
  if(res.status===403&&res.headers.get('x-ratelimit-remaining')==='0') throw new ApiError('rate',403);
  if(!res.ok) throw new ApiError('token',res.status);
}
async function fetchRemote(useToken, conditional){
  const r=await gh('GET', null, useToken, conditional&&etag?{'If-None-Match':etag}:null);
  if(r.unchanged) return null;
  if(r.missing){
    // Hadden we al gegevens? Dan is 'niet gevonden' een storing, geen lege opslag: niets overschrijven.
    if(sha||server.version>0) throw new ApiError('notfound',404);
    sha=null;etag=null;return defaultState();
  }
  sha=r.data.sha; etag=r.etag;
  let s=null; try{s=fixState(JSON.parse(b64decode(r.data.content)))}catch(e){}
  if(!s) throw new ApiError('broken',0);
  return s;
}
/* Nooit vanzelf uitloggen: alles blijft bewaard en de app probeert het later opnieuw.
   Weigert GitHub de sleutel een paar minuten achter elkaar, dan verschijnt een melding met een knop. */
let authFails=0, authSince=0;
function handleErr(e){
  if(e.kind==='token'||e.kind==='forbidden'||e.kind==='notfound'){
    if(!authFails) authSince=Date.now(); authFails++;
    setNet('error');
    if(e.kind==='token'&&authFails>=3&&Date.now()-authSince>=60000) showAuthProblem();
    return;
  }
  if(e.kind==='broken'){setNet('error');toast('Het opslagbestand op GitHub is beschadigd. Er is niets overschreven.');return}
  if(e.kind==='rate'){setNet('error');return}
  setNet(e.kind==='offline'?'offline':'error');
}
function showAuthProblem(){
  if($('authPanel')) return;
  const d=document.createElement('div'); d.className='panel typo'; d.id='authPanel';
  d.innerHTML='<label class="lbl">Sleutel geweigerd</label><p style="margin:0">GitHub accepteert de sleutel niet meer. Is hij verwijderd of vervangen? Je wijzigingen blijven op deze telefoon bewaard tot je opnieuw inlogt.</p>'
    +'<div class="row"><button class="btn" type="button" id="authRelogin">Opnieuw inloggen</button><button class="btn sec" type="button" id="authLater">Later</button></div>';
  document.querySelector('main').prepend(d);
  $('authRelogin').addEventListener('click',()=>relogin());
  $('authLater').addEventListener('click',()=>d.remove());
}
// Opnieuw inloggen met een nieuwe sleutel, zonder openstaande wijzigingen kwijt te raken
function relogin(){
  const keep=pending.slice(); lsSet('bs-pending-keep',JSON.stringify(keep));
  logout('Log opnieuw in met je naam en de (nieuwe) sleutel.');
}

let flushing=false;
async function flush(){
  clearTimeout(flushT);
  if(flushing||!pending.length||!token) return;
  flushing=true; setNet('sync');
  const batch=pending.slice();
  try{
    for(let attempt=0;;attempt++){
      // Altijd op de nieuwste stand voortbouwen, zodat wijzigingen van de ander niet verloren gaan.
      const latest=await fetchRemote(null,false);
      const next=JSON.parse(JSON.stringify(latest));
      batch.forEach(op=>applyOp(next,op));
      next.version=(latest.version||0)+1;
      try{
        const r=await gh('PUT',{message:'Boodschappenlijst bijgewerkt door '+(myName||'app'),content:b64encode(JSON.stringify(next)),...(sha?{sha}:{})});
        sha=r.data&&r.data.content?r.data.content.sha:null; etag=null;
        server=next; break;
      }catch(e){
        if(e.kind==='conflict'&&attempt<4){await new Promise(r=>setTimeout(r,300+Math.random()*700));continue}
        throw e;
      }
    }
    pending=pending.slice(batch.length);
    UI.loaded=true; persist(); recompute(); setNet('ok'); render();
  }catch(e){handleErr(e)}
  flushing=false;
  if(pending.length&&net==='ok') flush();
}
let polling=false;
async function poll(){
  if(!token||document.hidden||polling) return;
  if(pending.length){flush();return}
  polling=true;
  try{
    const s=await fetchRemote(null,true);
    setNet('ok');
    if(s&&!pending.length&&!flushing){server=s;UI.loaded=true;persist();recompute();render()}
  }catch(e){handleErr(e)}
  polling=false;
}
function setNet(n){
  net=n; if(n==='ok'){authFails=0; const a=$('authPanel'); if(a) a.remove()}
  const st=$('status'),t=$('statusText');
  st.className='status '+(n==='ok'?'ok':(n==='offline'||n==='error')?'offline':'');
  const p=pending.length;
  t.textContent = n==='ok' ? 'Gesynchroniseerd'
    : n==='sync' ? 'Opslaan…'
    : n==='offline' ? (p?'Offline · '+p+(p===1?' wijziging wacht':' wijzigingen wachten'):'Offline')
    : n==='error' ? (authFails?'Geen toegang, probeert opnieuw':'Niet bijgewerkt') : 'Verbinden…';
}

/* ---------- inloggen ---------- */
$('logout').addEventListener('click',()=>{
  if(pending.length&&!$('logout').dataset.sure){$('logout').dataset.sure='1';$('logout').textContent='Er wachten nog wijzigingen. Toch afmelden?';return}
  logout('');
});
function showLogin(msg){
  $('app').hidden=true;$('login').hidden=false;$('lock').hidden=true;
  $('nameInput').value=myName;$('loginErr').textContent=msg||'';
  (myName?$('codeInput'):$('nameInput')).focus();
}
function showApp(){$('login').hidden=true;$('app').hidden=false;recompute();render();setNet(net);poll();setTimeout(offerInstall,1500)}
function logout(msg){
  token=null;lsDel(K.token);lsDel(K.server);lsDel(K.pending);lsDel(LOCK_KEY);vaultKey=null;
  server=emptyState();pending=[];sha=null;etag=null;UI.loaded=false;view=null;
  $('logout').dataset.sure='';$('logout').textContent='Afmelden';
  showLogin(msg);
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('nameInput').value.trim().slice(0,30), c=$('codeInput').value.trim();
  if(!n||!c) return;
  $('loginBtn').disabled=true;$('loginErr').textContent='';
  try{
    await checkAccess(c);
    const s=await fetchRemote(c,false);
    token=c;myName=n;lsSet(K.token,c);lsSet(K.name,n);
    server=s;UI.loaded=true;
    const kept=parse(lsGet('bs-pending-keep')); if(Array.isArray(kept)&&kept.length){pending=kept.concat(pending)} lsDel('bs-pending-keep');
    persist();$('codeInput').value='';
    showApp();
    if(!sha) act({type:'renameList',id:'__init__',name:'x'}); // eerste keer: data.json aanmaken
    if($('useBio').checked&&bioAvailable()) enableLock();
  }catch(err){
    $('loginErr').textContent = err.kind==='token'?'Deze sleutel werkt niet. Controleer of hij toegang heeft tot '+DATA_REPO+' (Contents: lezen en schrijven).'
      : err.kind==='offline'?'Geen verbinding. Probeer het opnieuw zodra je internet hebt.'
      : err.kind==='rate'?'GitHub vraagt even rust. Probeer het over een paar minuten opnieuw.'
      : 'Er ging iets mis bij GitHub ('+err.kind+'). Probeer het opnieuw.';
  }
  $('loginBtn').disabled=false;
});

/* ---------- start ---------- */
setInterval(poll,5000);
window.addEventListener('online',poll);
window.addEventListener('focus',poll);
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(lockOn()) showLock('',true); else if(token){showApp();offerLock()} else showLogin('');
</script>
